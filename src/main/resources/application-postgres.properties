# Run with: gradlew bootRun --args="--spring.profiles.active=postgres"
# The database is started by "docker compose up -d" (see docker-compose.yml).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:eshop}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:hardpassword}
spring.datasource.driver-class-name=org.postgresql.Driver
