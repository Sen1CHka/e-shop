server.port=8090

# Default: embedded H2 database stored in ./data, no installation needed.
# Use the "postgres" profile (application-postgres.properties) for PostgreSQL.
spring.datasource.url=jdbc:h2:file:./data/eshop
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Demo categories, products, users and orders are inserted when the database is empty
app.seed-data=true

# Override the secret outside of development (env variable APP_JWT_SECRET), at least 32 characters
app.jwt.secret=${APP_JWT_SECRET:dev-only-secret-change-me-please-0123456789}
app.jwt.expiration-ms=28800000

app.cors.allowed-origins=http://localhost:*,http://127.0.0.1:*
