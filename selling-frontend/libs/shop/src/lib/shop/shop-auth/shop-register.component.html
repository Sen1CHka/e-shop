<div class="auth panel">
  <h1 class="page-title mb-1">Create an account</h1>
  <p class="auth-subtitle">Track your orders, save addresses and favourite products.</p>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div *ngIf="error" class="form-error mb-3" role="alert">
      <selling-icon name="alert"></selling-icon>
      <span>{{ error }}</span>
    </div>

    <selling-field label="Full name" for="realName" [control]="form.controls.realName" class="mb-1">
      <input id="realName" type="text" class="form-control" formControlName="realName" autocomplete="name" />
    </selling-field>

    <selling-field label="E-mail" for="email" [control]="form.controls.email" class="mb-1">
      <input id="email" type="email" class="form-control" formControlName="email" autocomplete="email" />
    </selling-field>

    <selling-field
      label="Username"
      for="username"
      hint="3-30 characters: letters, digits, dot, dash or underscore"
      [control]="form.controls.username"
      class="mb-1"
    >
      <input id="username" type="text" class="form-control" formControlName="username" autocomplete="username" />
    </selling-field>

    <selling-field label="Password" for="password" hint="At least 6 characters" [control]="form.controls.password" class="mb-2">
      <div class="password-field">
        <input
          id="password"
          [type]="showPassword ? 'text' : 'password'"
          class="form-control"
          formControlName="password"
          autocomplete="new-password"
        />
        <button
          type="button"
          class="icon-button"
          [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
          [attr.aria-pressed]="showPassword"
          (click)="showPassword = !showPassword"
        >
          <selling-icon [name]="showPassword ? 'eye-off' : 'eye'"></selling-icon>
        </button>
      </div>
    </selling-field>

    <button type="submit" class="btn btn-primary btn-lg w-100" [disabled]="isSubmitting">
      <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm" aria-hidden="true"></span>
      Create account
    </button>
  </form>

  <p class="auth-switch">
    Already have an account? <a routerLink="/login" [queryParams]="{ returnUrl: target }">Sign in</a>
  </p>
</div>
